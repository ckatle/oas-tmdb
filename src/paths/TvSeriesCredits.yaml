---
get:
  summary: Credits
  description: |
    Get the latest season credits of a TV show.

    > ### **Note**
    > This is the original TV credits method which returns the **latest season credit data**. If you would like to
    > request the aggregate view (which is what you see on our website) you should use the /aggregate_credits method.
  operationId: TvSeriesCredits
  tags:
    - TV Series
  parameters:
    - $ref: "../components/parameters/path/SeriesID.yaml"
    - $ref: "../components/parameters/query/LanguageParam.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Credits.yaml"
          example:
            id: 1399
            cast:
              - id: 22970
                adult: false
                gender: 2
                known_for_department: "Acting"
                name: "Peter Dinklage"
                original_name: "Peter Dinklage"
                popularity: 30.6
                profile_path: "/lRsRgnksAhBRXwAB68MFjmTtLrk.jpg"
                character: "Tyrion Lannister"
                credit_id: "5256c8b219c2956ff6047cd8"
                order: 0
            crew:
              - id: 1406855
                adult: false
                gender: 2
                known_for_department: "Production"
                name: "Duncan Muggoch"
                original_name: "Duncan Muggoch"
                popularity: 1.592
                profile_path: "/ukGjJ62Ejd4cFziald03G34Fsrp.jpg"
                credit_id: "5ceab029c3a3682e93217a85"
                department: "Production"
                job: "Producer"
    "401":
      $ref: "../components/responses/401Unauthorized.yaml"
    "404":
      $ref: "../components/responses/404NotFound.yaml"
    "429":
      $ref: "../components/responses/429TooManyRequests.yaml"
