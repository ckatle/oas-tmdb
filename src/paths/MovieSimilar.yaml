---
get:
  summary: Similar
  description: |
    Get the similar movies based on genres and keywords.

    > ### **Note**
    > This method only looks for other items based on genres and plot keywords. As such, the results found here
    > are not always going to be perfect. Use it with that in mind.
  operationId: MovieSimilar
  tags:
    - Movies
  parameters:
    - $ref: "../components/parameters/path/MovieID.yaml"
    - $ref: "../components/parameters/query/LanguageParam.yaml"
    - $ref: "../components/parameters/query/Page.yaml"
  responses:
    '200':
      $ref: "../components/responses/MovieListPage.yaml"
    '400':
      $ref: "../components/responses/400InvalidPage.yaml"
    '401':
      $ref: "../components/responses/401Unauthorized.yaml"
    '404':
      $ref: "../components/responses/404NotFound.yaml"
    '429':
      $ref: "../components/responses/429TooManyRequests.yaml"
