---
description: Details of a TV show.
allOf:
  - $ref: "./TvBase.yaml"
  - type: object
    properties:
      created_by:
        type: array
        items:
          $ref: "./Creator.yaml"
      episode_run_time:
        items:
          type: integer
          format: int32
      genres:
        type: array
        items:
          $ref: "./BaseObject.yaml"
      homepage:
        type: string
        format: uri
      in_production:
        type: boolean
      languages:
        type: array
        items:
          $ref: "./LanguageCode.yaml"
      last_air_date:
        type: string
        format: date
      last_episode_to_air:
        $ref: "./TvSeriesEpisode.yaml"
      next_episode_to_air:
        $ref: "./TvSeriesEpisode.yaml"
      networks:
        type: array
        items:
          $ref: "./OrganizationBase.yaml"
      number_of_episodes:
        type: integer
        format: int32
      number_of_seasons:
        type: integer
        format: int32
      production_companies:
        type: array
        items:
          $ref: "./OrganizationBase.yaml"
      production_countries:
        type: array
        items:
          $ref: "./ProductionCountry.yaml"
      seasons:
        type: array
        items:
          $ref: "./TvSeriesSeason.yaml"
      spoken_languages:
        type: array
        items:
          $ref: "./Language.yaml"
      status:
        type: string
      tagline:
        type: string
      type:
        type: string
      recommendations:
        $ref: "./MultiListPage.yaml"
      similar:
        $ref: "./TvListPage.yaml"
