---
description: A base TV object.
allOf:
  - $ref: "./BaseObject.yaml"
  - type: object
    required:
      - original_language
      - original_name
    properties:
      adult:
        type: boolean
      backdrop_path:
        type: string
      first_air_date:
        type: string
        format: date
      origin_country:
        type: array
        items:
          $ref: "./CountryCode.yaml"
      original_language:
        $ref: "./LanguageTag.yaml"
      original_name:
        type: string
      overview:
        type: string
      popularity:
        type: number
        format: float
      poster_path:
        type: string
      vote_average:
        type: number
        format: float
      vote_count:
        type: integer
        format: int32
