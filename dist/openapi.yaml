                    genre_ids:
                      - 18
                      - 10759
                      - 10765
                    id: 57243
                    origin_country:
                      - GB
                    original_language: en
                    original_name: Doctor Who
                    overview: 'The Doctor is a Time Lord: a 900 year old alien with 2 hearts, part of a gifted civilization who mastered time travel. The Doctor saves planets for a living—more of a hobby actually, and the Doctor''s very, very good at it.'
                    popularity: 69.7645
                    poster_path: /w8enSKCf6Zm0topeQ2XPccDqsqp.jpg
                    first_air_date: '2005-03-26'
                    name: Doctor Who
                    vote_average: 7.6
                    vote_count: 3220
                total_pages: 2
                total_results: 33
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /tv/{series_id}/similar:
    get:
