openapi: 3.1.0
info:
  title: TMDB API
  description: The Movie Database (TMDB) API
  version: 0.32.26
servers:
  - url: https://api.themoviedb.org/3
    description: Main (production) server
  - url: https://api.themoviedb.localhost
    description: Internal staging server for testing
security:
  - bearerAuth: []
tags:
  - name: Collections
    description: Collection details.
  - name: Companies
    description: Company details.
  - name: Configuration
    description: The configuration methods are useful to get the static lists of data we use throughout the database.
  - name: Genres
    description: Official genres for movies and TV shows.
  - name: Keywords
    description: Keyword details.
  - name: Movie Lists
    description: Lists of movies currently in theatres, popular movies, movies ordered by rating or upcoming movies.
  - name: Movies
    description: Movie credits, keywords or similar movies.
  - name: Networks
    description: TV network details.
  - name: Search
    description: Search for collection, companies, keywords, movies, people or TV shows.
paths:
  /collection/{collection_id}:
    get:
      summary: Get collection details by ID.
      operationId: CollectionDetails
      tags:
        - Collections
      parameters:
        - $ref: '#/components/parameters/CollectionID'
        - $ref: '#/components/parameters/LanguageParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              example:
                id: 1241
                name: Harry Potter Collection
                poster_path: /eVPs2Y0LyvTLZn6AP5Z6O2rtiGB.jpg
                backdrop_path: /hWK8gTH2riuv65Ej43hPSeE16Mu.jpg
                overview: The Harry Potter films are a fantasy series based on the series of seven Harry Potter novels by British writer J. K. Rowling.
                parts:
                  - adult: false
                    backdrop_path: /hziiv14OpD73u9gAak4XDDfBKa2.jpg
                    genre_ids:
                      - 12
                      - 14
                    id: 671
                    media_type: movie
                    original_language: en
                    original_title: Harry Potter and the Philosopher's Stone
                    overview: Harry Potter has lived under the stairs at his aunt and uncle's house his whole life. But on his 11th birthday, he learns he's a powerful wizard—with a place waiting for him at the Hogwarts School of Witchcraft and Wizardry. As he learns to harness his newfound powers with the help of the school's kindly headmaster, Harry uncovers the truth about his parents' deaths—and about the villain who's to blame.
                    popularity: 203.037
                    poster_path: /wuMc08IPKEatf9rnMNXvIDxqP4W.jpg
                    release_date: '2001-11-16'
                    title: Harry Potter and the Philosopher's Stone
                    video: false
                    vote_average: 7.914
                    vote_count: 26490
                  - adult: false
                    backdrop_path: /yHzyPJrVqlTySQ9mc379yxrLBYQ.jpg
                    genre_ids:
                      - 12
                      - 14
                    id: 672
                    media_type: movie
                    original_language: en
                    original_title: Harry Potter and the Chamber of Secrets
                    overview: 'Cars fly, trees fight back, and a mysterious house-elf comes to warn Harry Potter at the start of his second year at Hogwarts. Adventure and danger await when bloody writing on a wall announces: The Chamber Of Secrets Has Been Opened. To save Hogwarts will require all of Harry, Ron and Hermione’s magical abilities and courage.'
                    popularity: 157.67
                    poster_path: /sdEOH0992YZ0QSxgXNIGLq1ToUi.jpg
                    release_date: '2002-11-13'
                    title: Harry Potter and the Chamber of Secrets
                    video: false
                    vote_average: 7.7
                    vote_count: 21775
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /company/{company_id}:
    get:
      summary: Details
      description: Get the company details by ID.
      operationId: CompanyDetails
      tags:
        - Companies
      parameters:
        - $ref: '#/components/parameters/CompanyID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
              example:
                id: 1
                name: Lucasfilm Ltd.
                origin_country: US
                logo_path: /eDWGeg5tdVNcI8aBaaJ21bEBtFa.png
                headquarters: San Francisco, California
                homepage: https://www.lucasfilm.com
                description: ''
                parent_company: ''
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /configuration/countries:
    get:
      summary: Countries
      description: Get the list of countries (ISO 3166-1 tags) used throughout TMDB.
      operationId: ConfigurationCountries
      tags:
        - Configuration
      parameters:
        - $ref: '#/components/parameters/LanguageParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
                example:
                  - iso_3166_1: GB
                    english_name: United Kingdom
                    native_name: United Kingdom
                  - iso_3166_1: US
                    english_name: United States of America
                    native_name: United States
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /configuration/jobs:
    get:
      summary: Jobs
      description: Get the list of the jobs and departments we use on TMDB.
      operationId: ConfigurationJobs
      tags:
        - Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
                example:
                  - department: Actors
                    jobs:
                      - Actor
                      - Cameo
                      - Special Guest
                      - Voice
                  - department: Directing
                    jobs:
                      - Director
                      - Other
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /configuration/languages:
    get:
      summary: Languages
      description: Get the list of languages (ISO 639-1 tags) used throughout TMDB.
      operationId: ConfigurationLanguages
      tags:
        - Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'
                example:
                  - iso_639_1: en
                    english_name: English
                    name: English
                  - iso_639_1: eo
                    english_name: Esperanto
                    name: Esperanto
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /configuration/primary_translations:
    get:
      summary: Primary Translations.
      description: Get a list of the officially supported translations on TMDB.
      operationId: ConfigurationPrimaryTranslations
      tags:
        - Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - en-GB
                  - en-US
                  - eo-EO
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /configuration/timezones:
    get:
      summary: Timezones
      description: Get the list of timezones used throughout TMDB.
      operationId: ConfigurationTimezones
      tags:
        - Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CountryWithTimezones'
                example:
                  - iso_3166_1: ES
                    zones:
                      - Europe/Madrid
                      - Africa/Ceuta
                      - Atlantic/Canary
                  - iso_3166_1: GB
                    zones:
                      - Europe/London
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /genre/movie/list:
    get:
      summary: Movie List
      description: Get the list of official genres for movies.
      operationId: GenreMovieList
      tags:
        - Genres
      parameters:
        - $ref: '#/components/parameters/LanguageParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreList'
              example:
                genres:
                  - id: 12
                    name: Adventure
                  - id: 14
                    name: Fantasy
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /genre/tv/list:
    get:
      summary: TV List
      description: Get the list of official genres for TV shows.
      operationId: GenreTvList
      tags:
        - Genres
      parameters:
        - $ref: '#/components/parameters/LanguageParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreList'
              example:
                genres:
                  - id: 10759
                    name: Action & Adventure
                  - id: 10765
                    name: Sci-Fi & Fantasy
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /keyword/{keyword_id}:
    get:
      summary: Details
      description: '---'
      operationId: KeywordDetails
      tags:
        - Keywords
      parameters:
        - $ref: '#/components/parameters/KeywordID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseObject'
              example:
                id: 1701
                name: hero
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/now_playing:
    get:
      summary: Now Playing
      description: |
        Get a list of movies that are currently in theatres.

        > ### **Note**
        > This call is really just a discover call behind the scenes. If you would like to tweak any of the default
        > filters head over and read about [discover](https://developer.themoviedb.org/reference/discover-movie).
      operationId: MovieNowPlayingList
      tags:
        - Movie Lists
      parameters:
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Region'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieListPageWithDates'
              examples:
                MovieListPageWithDatesExample:
                  $ref: '#/components/examples/MovieListPageWithDatesExample'
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/popular:
    get:
      summary: Popular
      description: |
        Get a list of movies ordered by popularity.

        > ### **Note**
        > This call is really just a discover call behind the scenes. If you would like to tweak any of the default
        > filters head over and read about [discover](https://developer.themoviedb.org/reference/discover-movie).
      operationId: MoviePopularList
      tags:
        - Movie Lists
      parameters:
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Region'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieListPage'
              examples:
                MovieListPageExample:
                  $ref: '#/components/examples/MovieListPageExample'
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/top_rated:
    get:
      summary: Top Rated
      description: |
        Get a list of movies ordered by rating.

        > ### **Note**
        > This call is really just a discover call behind the scenes. If you would like to tweak any of the default
        > filters head over and read about [discover](https://developer.themoviedb.org/reference/discover-movie).
      operationId: MovieTopRatedList
      tags:
        - Movie Lists
      parameters:
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Region'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieListPage'
              examples:
                MovieListPageExample:
                  $ref: '#/components/examples/MovieListPageExample'
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/upcoming:
    get:
      summary: Upcoming
      description: |
        Get a list of movies that are being released soon.

        > ### **Note**
        > This call is really just a discover call behind the scenes. If you would like to tweak any of the default
        > filters head over and read about [discover](https://developer.themoviedb.org/reference/discover-movie).
      operationId: MovieUpcomingList
      tags:
        - Movie Lists
      parameters:
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Region'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieListPageWithDates'
              examples:
                MovieListPageWithDatesExample:
                  $ref: '#/components/examples/MovieListPageWithDatesExample'
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/{movie_id}/credits:
    get:
      summary: Credits
      description: Get the credits of a movie.
      operationId: MovieCredits
      tags:
        - Movies
      parameters:
        - $ref: '#/components/parameters/MovieID'
        - $ref: '#/components/parameters/LanguageParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsWithID'
              example:
                id: 671
                cast:
                  - adult: false
                    gender: 2
                    id: 10980
                    known_for_department: Acting
                    name: Daniel Radcliffe
                    original_name: Daniel Radcliffe
                    popularity: 7.6526
                    profile_path: /iPg0J9UzAlPj1fLEJNllpW9IhGe.jpg
                    cast_id: 27
                    character: Harry Potter
                    credit_id: 52fe4267c3a36847f801be91
                    order: 0
                  - adult: false
                    gender: 2
                    id: 10989
                    known_for_department: Acting
                    name: Rupert Grint
                    original_name: Rupert Grint
                    popularity: 2.3248
                    profile_path: /q2KZZ0ltTEl7Sf8volNFV1JDEP4.jpg
                    cast_id: 37
                    character: Ron Weasley
                    credit_id: 52fe4267c3a36847f801beb9
                    order: 1
                  - adult: false
                    gender: 1
                    id: 10990
                    known_for_department: Acting
                    name: Emma Watson
                    original_name: Emma Watson
                    popularity: 5.1613
                    profile_path: /A14lLCZYDhfYdBa0fFRpwMDiwRN.jpg
                    cast_id: 49
                    character: Hermione Granger
                    credit_id: 531736ea92514138c00010a3
                    order: 2
                crew:
                  - adult: false
                    gender: 2
                    id: 10965
                    known_for_department: Directing
                    name: Chris Columbus
                    original_name: Chris Columbus
                    popularity: 2.5737
                    profile_path: /yCyEz90NqjEXKZ7HYcEhDXlLlPc.jpg
                    credit_id: 52fe4267c3a36847f801be05
                    department: Directing
                    job: Director
                  - adult: false
                    gender: 1
                    id: 10966
                    known_for_department: Writing
                    name: J.K. Rowling
                    original_name: J.K. Rowling
                    popularity: 0.7377
                    profile_path: /8VDx3K8NBGJDEWr4KdsGsuT8wuj.jpg
                    credit_id: 52fe4267c3a36847f801be0b
                    department: Writing
                    job: Novel
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/{movie_id}/keywords:
    get:
      summary: Keywords
      description: Get the keywords for a movie.
      operationId: MovieKeywords
      tags:
        - Movies
      parameters:
        - $ref: '#/components/parameters/MovieID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordsWithID'
              example:
                id: 671
                keywords:
                  - id: 616
                    name: witch
                  - id: 818
                    name: based on novel or book
                  - id: 177912
                    name: wizard
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/{movie_id}/recommendations:
    get:
      summary: Recommendations
      operationId: MovieRecommendations
      tags:
        - Movies
      parameters:
        - $ref: '#/components/parameters/MovieID'
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieListPage'
              examples:
                MovieListPageExample:
                  $ref: '#/components/examples/MovieListPageExample'
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /movie/{movie_id}/similar:
    get:
      summary: Similar
      description: |
        Get the similar movies based on genres and keywords.

        > ### **Note**
        > This method only looks for other items based on genres and plot keywords. As such, the results found here
        > are not always going to be perfect. Use it with that in mind.
      operationId: MovieSimilar
      tags:
        - Movies
      parameters:
        - $ref: '#/components/parameters/MovieID'
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieListPage'
              examples:
                MovieListPageExample:
                  $ref: '#/components/examples/MovieListPageExample'
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /network/{network_id}:
    get:
      summary: Details
      description: Get the TV network details by ID.
      operationId: NetworkDetails
      tags:
        - Networks
      parameters:
        - $ref: '#/components/parameters/NetworkID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                id: 49
                name: HBO
                origin_country: US
                logo_path: /tuomPhY2UtuPTqqFnKMVHvSb724.png
                headquarters: New York City, New York
                homepage: https://www.hbo.com
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /search/collection:
    get:
      summary: Collection
      description: Search for collections by their original, translated and alternative names.
      operationId: SearchCollection
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/IncludeAdult'
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Region'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListPage'
              example:
                page: 1
                results:
                  - id: 1241
                    name: Harry Potter Collection
                    adult: false
                    original_language: en
                    original_name: Harry Potter Collection
                    overview: The Harry Potter films are a fantasy series based on the series of seven Harry Potter novels by British writer J. K. Rowling.
                    poster_path: /eVPs2Y0LyvTLZn6AP5Z6O2rtiGB.jpg
                    backdrop_path: /xN6SBJVG8jqqKQrgxthn3J2m49S.jpg
                total_pages: 1
                total_results: 1
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /search/company:
    get:
      summary: Company
      description: Search for companies by their original and alternative names.
      operationId: SearchCompany
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListPage'
              example:
                page: 1
                results:
                  - id: 3268
                    name: HBO
                    origin_country: US
                    logo_path: /tuomPhY2UtuPTqqFnKMVHvSb724.png
                  - id: 14914
                    name: HBO Documentary Films
                    origin_country: US
                    logo_path: /1RZBWz53SpHUTLpRcM8BGv2plIP.png
                total_pages: 2
                total_results: 22
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /search/keyword:
    get:
      summary: Keyword
      description: Search for keywords by their name.
      operationId: SearchKeyword
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseObjectListPage'
              example:
                page: 1
                results:
                  - id: 262419
                    name: lost
                total_pages: 5
                total_results: 84
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /search/movie:
    get:
      summary: Movie
      description: Search for movies by their original, translated and alternative titles.
      operationId: SearchMovie
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/IncludeAdult'
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/PrimaryReleaseYear'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Region'
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieListPage'
              examples:
                MovieListPageExample:
                  $ref: '#/components/examples/MovieListPageExample'
        '400':
          $ref: '#/components/responses/400InvalidPage'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
  /search/multi:
    get:
      summary: Multi
      description: Use multi search when you want to search for movies, TV shows and people in a single request.
      operationId: SearchMulti
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/IncludeAdult'
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
