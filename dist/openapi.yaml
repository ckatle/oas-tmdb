          $ref: '#/components/responses/429TooManyRequests'
components:
  schemas:
    BaseObject:
      type: object
      description: The most generic type of item.
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
          description: The identifier of the item.
          example: 12
        name:
          type: string
          example: Adventure
    CollectionBase:
      description: A basic movie collection model.
      allOf:
        - $ref: '#/components/schemas/BaseObject'
        - type: object
          required:
            - backdrop_path
            - poster_path
          properties:
            poster_path:
              type: string
            backdrop_path:
              type: string
          example:
            id: 1241
            name: Harry Potter Collection
            poster_path: /eVPs2Y0LyvTLZn6AP5Z6O2rtiGB.jpg
            backdrop_path: /xN6SBJVG8jqqKQrgxthn3J2m49S.jpg
    MovieListItemWithMediaType:
      description: A movie item with media type as discriminator for list representation.
      allOf:
        - $ref: '#/components/schemas/MediaType'
        - $ref: '#/components/schemas/MovieListItem'
    MediaType:
      type: object
      description: A media type
      discriminator:
        propertyName: media_type
        mapping:
          movie: '#/components/schemas/MovieListItemWithMediaType'
          person: '#/components/schemas/PersonListItemWithMediaType'
          tv: '#/components/schemas/TvListItemWithMediaType'
      required:
        - media_type
      properties:
        media_type:
          type: string
          enum:
            - movie
            - person
            - tv
          x-enum-varnames:
            - MediaTypeMovie
            - MediaTypePerson
            - MediaTypeTv
          x-go-type-name: MediaType
    CountryCode:
      type: string
      description: |
        [ISO 3166-1 alpha-2 code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
    TvBase:
      description: A base TV object.
      allOf:
        - $ref: '#/components/schemas/BaseObject'
        - type: object
          required:
            - original_language
            - original_name
          properties:
            adult:
              type: boolean
            backdrop_path:
              type: string
            first_air_date:
              type: string
              format: date
            origin_country:
              type: array
              items:
                $ref: '#/components/schemas/CountryCode'
            original_language:
              type: string
            original_name:
              type: string
            overview:
              type: string
            popularity:
              type: number
              format: float
            poster_path:
              type: string
            vote_average:
              type: number
              format: float
            vote_count:
              type: integer
              format: int32
    TvListItem:
      description: A basic TV item for list representation.
      allOf:
        - $ref: '#/components/schemas/TvBase'
        - type: object
          properties:
            genre_ids:
              type: array
              items:
                type: integer
                format: int32
    TvListItemWithMediaType:
      description: A basic TV item with media type as discriminator for list representation.
      allOf:
        - $ref: '#/components/schemas/MediaType'
        - $ref: '#/components/schemas/TvListItem'
    PersonListItem:
      description: A basic person item for list representation.
      allOf:
        - $ref: '#/components/schemas/BaseObject'
        - type: object
          properties:
            original_name:
              type: string
            adult:
              type: boolean
            gender:
              type: integer
              format: int32
            known_for_department:
              type: string
            popularity:
              type: number
              format: float
            profile_path:
              type: string
            known_for:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/MovieListItemWithMediaType'
                  - $ref: '#/components/schemas/TvListItemWithMediaType'
    PersonListItemWithMediaType:
      description: A person item with media type as discriminator for list representation.
      allOf:
        - $ref: '#/components/schemas/MediaType'
        - $ref: '#/components/schemas/PersonListItem'
    MovieBase:
      type: object
      description: A base movie object.
      required:
        - id
        - title
        - original_language
        - original_title
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        original_language:
          type: string
        original_title:
          type: string
        adult:
          type: boolean
        backdrop_path:
          type: string
        overview:
          type: string
        popularity:
          type: number
          format: float
        poster_path:
          type: string
        release_date:
          type: string
          format: date
        video:
          type: boolean
        vote_average:
          type: number
          format: float
        vote_count:
          type: integer
          format: int32
    MovieListItem:
      description: A basic movie item for list representation.
      allOf:
        - $ref: '#/components/schemas/MovieBase'
        - type: object
          properties:
            genre_ids:
              type: array
              items:
                type: integer
                format: int32
    Collection:
      description: Detail information about a collection.
      allOf:
        - $ref: '#/components/schemas/CollectionBase'
        - type: object
          required:
            - overview
            - parts
          properties:
            overview:
              type: string
            parts:
              type: array
              items:
                $ref: '#/components/schemas/MovieListItemWithMediaType'
    Error:
      type: object
      description: Error model
      additionalProperties: false
      required:
        - success
        - status_code
        - status_message
      properties:
        success:
          type: boolean
          example: false
        status_code:
          type: integer
          format: int32
          minimum: 1
          maximum: 47
          example: 1
        status_message:
          type: string
          example: Success.
    OrganizationBase:
      description: Basic information about an organization.
      allOf:
        - $ref: '#/components/schemas/BaseObject'
        - type: object
          properties:
            origin_country:
              $ref: '#/components/schemas/CountryCode'
            logo_path:
              type: string
    Organization:
      description: An organization such as a company or a TV network.
      allOf:
        - $ref: '#/components/schemas/OrganizationBase'
        - type: object
          properties:
            headquarters:
              type: string
            homepage:
              type: string
              format: uri
    Company:
      description: A production company.
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          properties:
            description:
              type: string
            parent_company:
              type: string
    Country:
      type: object
      description: A country represented by the two-letter country code with english and native name.
      additionalProperties: false
      required:
        - iso_3166_1
        - english_name
      properties:
        iso_3166_1:
          $ref: '#/components/schemas/CountryCode'
        english_name:
          type: string
        native_name:
          type: string
    Department:
      type: object
      description: Department with jobs
      additionalProperties: false
      required:
        - department
        - jobs
      properties:
        department:
          type: string
          description: The name of the department
        jobs:
          type: array
          description: A list of jobs within the department
          items:
            type: string
    Language:
      type: object
      description: A language represented by the ISO 639-1 tag with the english and native name of this language.
      additionalProperties: false
      required:
        - iso_639_1
        - english_name
      properties:
        iso_639_1:
          type: string
          description: ISO 639-1 tag
          minLength: 2
          maxLength: 2
          pattern: ^[a-z]{2}$
        english_name:
          type: string
          description: English name of the language
        name:
          type: string
          description: Native name of the language
    CountryWithTimezones:
      type: object
      description: A country represented by the two-letter country code with a list of timezones.
      additionalProperties: false
      required:
        - iso_3166_1
        - zones
      properties:
        iso_3166_1:
          $ref: '#/components/schemas/CountryCode'
        zones:
          type: array
          items:
            type: string
    GenreList:
      type: object
      description: A list of genres
      required:
        - genres
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/BaseObject'
          example:
            - id: 12
              name: Adventure
            - id: 14
              name: Fantasy
    ResultPage:
      type: object
      description: A base result page.
      required:
        - page
        - total_pages
        - total_results
      properties:
        page:
          description: The current page number.
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        total_pages:
          description: The number of total pages.
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        total_results:
          description: The number of total results.
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
      example:
        page: 1
        total_pages: 1
        total_results: 1
    MovieListPage:
      description: A result page used for a list of movies ordered by popularity or rating.
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/MovieListItem'
    MovieListPageWithDates:
      description: A result page with min and max dates used for a list of movies that are currently in theatres or upcoming movies.
      allOf:
        - type: object
          properties:
            dates:
              type: object
              properties:
                maximum:
                  type: string
                  format: date
                minimum:
                  type: string
                  format: date
              required:
                - maximum
                - minimum
          required:
            - dates
        - $ref: '#/components/schemas/MovieListPage'
    Creator:
      description: The creator of a TV show.
      allOf:
        - $ref: '#/components/schemas/BaseObject'
        - type: object
          properties:
            credit_id:
              type: string
            original_name:
              type: string
            gender:
              type: integer
              format: int32
            profile_path:
              type: string
    CreditBase:
      description: A base model for a member of the cast or the crew.
      allOf:
        - $ref: '#/components/schemas/Creator'
        - type: object
          properties:
            adult:
              type: boolean
            known_for_department:
              type: string
            popularity:
              type: number
              format: float
    CastMember:
      description: A member of the cast of a movie or a TV show.
      allOf:
        - $ref: '#/components/schemas/CreditBase'
        - type: object
          properties:
            cast_id:
              type: integer
              format: int32
            character:
              type: string
            order:
              type: integer
              format: int32
    CrewMember:
      description: A member of the crew of a movie or a TV show.
      allOf:
        - $ref: '#/components/schemas/CreditBase'
        - type: object
          properties:
            department:
              type: string
            job:
              type: string
    Credits:
      type: object
      description: The credits (cast and crew) of a movie or a TV show.
      required:
        - cast
        - crew
      properties:
        cast:
          type: array
          items:
            $ref: '#/components/schemas/CastMember'
        crew:
          type: array
          items:
            $ref: '#/components/schemas/CrewMember'
    CreditsWithID:
      description: The credits (cast and crew) of a movie or a TV show and the identifier of this item.
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int32
        - $ref: '#/components/schemas/Credits'
    KeywordsWithID:
      type: object
      description: A list of keywords with the movie id.
      required:
        - keywords
      properties:
        id:
          type: integer
          format: int32
        keywords:
          description: A list of keyword for the movie.
          type: array
          items:
            $ref: '#/components/schemas/BaseObject'
    CollectionListItem:
      description: An item of a collection search result page.
      allOf:
        - $ref: '#/components/schemas/CollectionBase'
        - type: object
          properties:
            adult:
              type: boolean
              example: false
            original_language:
              type: string
              example: en
            original_name:
              type: string
              example: Harry Potter Collection
            overview:
              type: string
              example: The Harry Potter films are a fantasy series based on the series of seven Harry Potter novels by British writer J. K. Rowling.
          required:
            - original_language
            - original_name
    CollectionListPage:
      description: A result page for a search for collections.
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/CollectionListItem'
          required:
            - results
    CompanyListPage:
      description: A result page of a search for companies.
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationBase'
          required:
            - results
    BaseObjectListPage:
      description: A result page for basic objects like genres or keywords.
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/BaseObject'
    MultiListPage:
      description: A result page used for a list of movies, people or TV shows.
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                oneOf:
                  - $ref: '#/components/schemas/MovieListItemWithMediaType'
                  - $ref: '#/components/schemas/PersonListItemWithMediaType'
                  - $ref: '#/components/schemas/TvListItemWithMediaType'
    PersonListPage:
      description: A result page used for a list of people.
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/PersonListItem'
          required:
            - results
    TvListPage:
      description: A result page used for a list of TV shows.
      allOf:
        - $ref: '#/components/schemas/ResultPage'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/TvListItem'
          required:
            - results
  parameters:
    CollectionID:
      in: path
      name: collection_id
      description: The collection ID.
      schema:
        type: integer
        format: int32
      required: true
    LanguageParam:
      in: query
      name: language
      description: '`ISO-639-1`-`ISO-3166-1` code'
      schema:
        type: string
        minLength: 2
        maxLength: 5
        pattern: ^([a-z]{2})(-([A-Z]{2}))?$
        default: en-US
        example: eo
    CompanyID:
      in: path
      name: company_id
      description: The company ID.
      required: true
      schema:
        type: integer
        format: int32
    KeywordID:
      in: path
      name: keyword_id
      description: The keyword ID.
      required: true
      schema:
        type: integer
        format: int32
    Page:
      in: query
      name: page
      description: The page number to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 1
    Region:
      in: query
      name: region
      schema:
        type: string
        minLength: 2
        maxLength: 2
        pattern: ^([A-Z]{2})$
      description: '`ISO-3166-1` code'
    MovieID:
      in: path
      name: movie_id
      description: The movie ID.
      required: true
      schema:
        type: integer
        format: int32
    NetworkID:
      in: path
      name: network_id
      description: The TV network ID.
      required: true
      schema:
        type: integer
        format: int32
    Query:
      in: query
      name: query
      description: The search string.
      required: true
      schema:
        type: string
    IncludeAdult:
      in: query
      name: include_adult
      schema:
        type: boolean
        default: false
      description: Include adult items.
    PrimaryReleaseYear:
      in: query
      name: primary_release_year
      description: Search only the primary release year.
      schema:
        type: integer
        format: int32
        minimum: 1000
        maximum: 9999
    Year:
      in: query
      name: year
      description: Search for all release dates or air dates.
      schema:
        type: integer
        format: int32
        minimum: 1000
        maximum: 9999
    FirstAirDateYear:
      in: query
      name: first_air_date_year
      description: 'Search only the first air date. Valid values are: 1000..9999'
      schema:
        type: integer
        format: int32
        minimum: 1000
        maximum: 9999
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    401Unauthorized:
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 7
            status_message: 'Invalid API key: You must be granted a valid key.'
    404NotFound:
      description: The server can not find the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 34
            status_message: The resource you requested could not be found.
    429TooManyRequests:
      description: Too many requests in a given amount of time (“rate limiting”).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 25
            status_message: Your request count is over the allowed limit.
    400InvalidPage:
      description: Invalid page number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            status_code: 22
            status_message: 'Invalid page: Pages start at 1 and max at 500. They are expected to be an integer.'
