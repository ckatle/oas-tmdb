      description: Get the similar TV shows.
      operationId: TvSeriesSimilar
      tags:
        - TV Series
      parameters:
        - $ref: '#/components/parameters/SeriesID'
        - $ref: '#/components/parameters/LanguageParam'
        - $ref: '#/components/parameters/Page'
      responses:
